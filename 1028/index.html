<!DOCTYPE html>
<html>
<body style="text-align: center;">

<h1>資訊三乙陳文琦</h1>

<!-- 加入跑馬燈效果並置中 -->
<marquee style="color: blue; font-weight: bold; width: 80%; margin: 0 auto;">歡迎來到電燈開關控制頁面！點擊下方按鈕切換燈泡狀態。</marquee>

<script>
function light(sw) {
  var pic;
  if (sw == 0) {
    pic = "pic/pic_bulboff.gif"
  } else {
    pic = "pic/pic_bulbon.gif"
  }
  document.getElementById('myImage').src = pic;
}
</script>

<div>
  <img id="myImage" src="pic/pic_bulboff.gif" width="100" height="180">
</div>

<p>
  <button type="button" onclick="light(1)">Light On</button>
  <button type="button" onclick="light(0)">Light Off</button>
</p>

</body>
</html>
